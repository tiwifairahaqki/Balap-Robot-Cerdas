
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101827">
<title>Balap Robot Cerdas - 4 Kelompok</title>

<style>
:root {
  --bg:#101827;
  --panel:#192438;
  --text:#f8fafc;
  --muted:#b7c3d8;
  --green:#4ade80;
}
* { box-sizing:border-box; }
body {
  margin:0;
  padding:14px;
  background:radial-gradient(circle at top,#263753,#101827 70%);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}
header { text-align:center; margin:5px 0 16px; }
header h1 {
  color:var(--green);
  margin:6px 0;
  font-size:clamp(23px,3vw,38px);
}
header p { color:var(--muted); margin:5px 0; }
.topbar {
  display:flex;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:14px;
}
button {
  border:0;
  border-radius:9px;
  padding:11px 13px;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
  touch-action:manipulation;
}
button:disabled { opacity:.5; cursor:not-allowed; }
.primary { background:var(--green); color:#102018; }
.secondary { background:#34445f; color:white; }
.status {
  text-align:center;
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
  margin:10px 0;
}
.settings {
  max-width:700px;
  margin:0 auto 14px;
  padding:14px;
  border:1px solid #34445f;
  background:var(--panel);
  border-radius:12px;
}
.settings label { display:block; margin-bottom:6px; color:var(--muted); }
.settings input {
  width:100%;
  background:#101827;
  border:1px solid #475873;
  color:white;
  padding:11px;
  border-radius:8px;
  font-size:14px;
}
.settings .actions {
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:10px;
}
.settings .actions button { flex:1; }
.groups {
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:10px;
  align-items:stretch;
}
.group {
  --color:#60a5fa;
  min-width:0;
  background:var(--panel);
  border:2px solid var(--color);
  border-radius:13px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
.group-head {
  text-align:center;
  background:color-mix(in srgb,var(--color) 17%,#192438);
  padding:12px 5px;
  border-bottom:1px solid #34445f;
}
.group-head h2 {
  color:var(--color);
  margin:0 0 5px;
  font-size:clamp(13px,1.7vw,21px);
}
.group-head .robot-icon { font-size:34px; }
.score { font-size:20px; font-weight:bold; margin-top:4px; }
.progress-area { padding:10px 9px 0; }
.progress-label {
  display:flex;
  justify-content:space-between;
  gap:3px;
  color:var(--muted);
  font-size:11px;
  margin-bottom:8px;
}
.race-track {
  height:35px;
  border-radius:18px;
  background:#0c1422;
  border:1px solid #475873;
  position:relative;
  overflow:hidden;
}
.race-fill {
  position:absolute;
  top:0;
  bottom:0;
  left:0;
  width:0%;
  background:color-mix(in srgb,var(--color) 30%,transparent);
  transition:width .3s ease;
}
.race-robot {
  position:absolute;
  top:1px;
  left:0%;
  transform:translateX(-2%);
  font-size:25px;
  transition:left .3s ease;
}
.question-area {
  padding:12px 10px;
  display:flex;
  flex-direction:column;
  flex:1;
}
.question-number {
  color:var(--color);
  font-weight:bold;
  font-size:12px;
  margin-bottom:8px;
}
.question {
  font-size:clamp(13px,1.35vw,17px);
  line-height:1.45;
  font-weight:bold;
  margin:0 0 12px;
  overflow-wrap:anywhere;
}
.answers {
  display:flex;
  flex-direction:column;
  gap:8px;
}
.answer {
  width:100%;
  min-height:44px;
  text-align:left;
  line-height:1.35;
  background:#263650;
  color:white;
  border:1px solid #435570;
  padding:10px;
  font-size:clamp(12px,1.2vw,15px);
  overflow-wrap:anywhere;
}
.answer:active:not(:disabled) { transform:scale(.98); }
.answer.correct {
  background:#166534;
  border-color:#4ade80;
}
.answer.wrong {
  background:#7f1d1d;
  border-color:#fb7185;
}
.feedback {
  min-height:48px;
  padding-top:10px;
  font-size:12px;
  font-weight:bold;
  line-height:1.5;
  overflow-wrap:anywhere;
}
.group-done {
  display:none;
  margin-top:auto;
  padding:10px 5px;
  text-align:center;
  color:var(--green);
  font-weight:bold;
}
footer {
  text-align:center;
  color:var(--muted);
  margin:18px 0 5px;
  font-size:13px;
  line-height:1.7;
}
footer a { color:#93c5fd; text-decoration:none; }
#result {
  display:none;
  max-width:700px;
  margin:16px auto;
  background:#443817;
  border:1px solid #8b782b;
  border-radius:13px;
  text-align:center;
  padding:20px;
}
#result h2 { color:#facc15; }
#result ol {
  display:inline-block;
  text-align:left;
  line-height:1.8;
}
@media(max-width:600px) {
  body { padding:5px; }
  .groups { gap:4px; }
  .group { border-radius:8px; border-width:1px; }
  .group-head { padding:8px 2px; }
  .group-head .robot-icon { font-size:25px; }
  .score { font-size:15px; }
  .progress-area { padding:7px 4px 0; }
  .progress-label { font-size:9px; }
  .race-track { height:26px; }
  .race-robot { font-size:19px; }
  .question-area { padding:8px 4px; }
  .question { font-size:12px; }
  .question-number { font-size:10px; }
  .answer { padding:8px 4px; min-height:48px; font-size:11px; }
  .feedback { font-size:10px; min-height:56px; }
  .group-head h2 { font-size:12px; }
}
@media(min-width:900px) {
  .question-area { padding:16px 13px; }
  .answers { gap:10px; }
  .answer { min-height:55px; padding:12px; }
}
</style>
</head>

<body>
<header>
  <div style="font-size:40px">🏁 🤖 🏁</div>
  <h1>BALAP ROBOT CERDAS</h1>
  <p>4 Kelompok • 50 Soal • Balapan Pengetahuan</p>
</header>

<section class="settings">
  <label for="sheetId">ID Google Spreadsheet</label>
  <input id="sheetId" type="text"
    value="1hUuc9ya1jKXgyiW2tBPEXsHtot4cxsxpqgopYh-8sPU"
    placeholder="Masukkan ID spreadsheet">

  <div class="actions">
    <button class="secondary" id="loadBtn">📄 Muat Soal</button>
    <button class="primary" id="startBtn">▶ Mulai Balapan</button>
    <button class="secondary" id="fullBtn">⛶ Layar Penuh</button>
  </div>
  <div id="loadStatus" class="status">
    Soal cadangan tersedia. Muat spreadsheet untuk menggunakan soal milikmu.
  </div>
</section>

<main class="groups" id="groups"></main>

<section id="result">
  <div style="font-size:48px">🏆</div>
  <h2>Balapan Selesai!</h2>
  <p id="winnerText"></p>
  <h3>Peringkat Kelompok</h3>
  <ol id="ranking"></ol>
  <button class="primary" onclick="startGame()">🔄 Main Lagi</button>
</section>

<footer>
  Dibuat oleh: <strong>Tiwi Faira Haqki</strong><br>
  Instagram:
  <a href="https://www.instagram.com/tiwifh/"
     target="_blank" rel="noopener noreferrer">@tiwifh</a>
</footer>

<script>
const DEFAULT_SHEET_ID =
  "1hUuc9ya1jKXgyiW2tBPEXsHtot4cxsxpqgopYh-8sPU";

const TOTAL_QUESTIONS = 50;

const groupInfo = [
  { name:"KELOMPOK 1", color:"#60a5fa", robot:"🤖" },
  { name:"KELOMPOK 2", color:"#fb7185", robot:"🤖" },
  { name:"KELOMPOK 3", color:"#4ade80", robot:"🤖" },
  { name:"KELOMPOK 4", color:"#c084fc", robot:"🤖" }
];

const fallbackQuestions = [
  {q:"Apa ibu kota Indonesia?",correct:"Jakarta",wrong:["Bandung","Surabaya"]},
  {q:"Berapa hasil 12 × 8?",correct:"96",wrong:["86","108"]},
  {q:"Planet yang dikenal sebagai Planet Merah adalah?",correct:"Mars",wrong:["Venus","Jupiter"]},
  {q:"Apa kepanjangan CPU?",correct:"Central Processing Unit",wrong:["Computer Personal Utility","Central Program Unit"]},
  {q:"Hewan yang dikenal sebagai raja hutan adalah?",correct:"Singa",wrong:["Gajah","Kuda"]},
  {q:"Berapa jumlah sisi pada segitiga?",correct:"3",wrong:["4","5"]},
  {q:"Air membeku pada suhu berapa derajat Celsius?",correct:"0°C",wrong:["10°C","100°C"]},
  {q:"Bahasa untuk membuat struktur halaman web adalah?",correct:"HTML",wrong:["SQL","Photoshop"]},
  {q:"Benua terbesar di dunia adalah?",correct:"Asia",wrong:["Afrika","Eropa"]},
  {q:"Apa nama satelit alami Bumi?",correct:"Bulan",wrong:["Matahari","Mars"]},
  {q:"Berapa hasil 144 ÷ 12?",correct:"12",wrong:["10","14"]},
  {q:"Organ tubuh yang memompa darah adalah?",correct:"Jantung",wrong:["Paru-paru","Ginjal"]},
  {q:"Apa rumus kimia air?",correct:"H2O",wrong:["CO2","O2"]},
  {q:"Ulat akan berkembang menjadi?",correct:"Kupu-kupu",wrong:["Kucing","Ikan"]},
  {q:"Berapa jumlah hari dalam satu minggu?",correct:"7",wrong:["5","10"]},
  {q:"Alat untuk mengukur suhu adalah?",correct:"Termometer",wrong:["Barometer","Speedometer"]},
  {q:"Campuran warna merah dan kuning menghasilkan?",correct:"Jingga",wrong:["Hijau","Ungu"]},
  {q:"Proses tumbuhan membuat makanan disebut?",correct:"Fotosintesis",wrong:["Evaporasi","Kondensasi"]},
  {q:"Berapa bulan dalam satu tahun?",correct:"12",wrong:["10","11"]},
  {q:"Berapa hasil 9 × 9?",correct:"81",wrong:["72","99"]}
];

let questions = [...fallbackQuestions];
let decks = [[],[],[],[]];
let answered = [0,0,0,0];
let scores = [0,0,0,0];
let busy = [false,false,false,false];
let gameRunning = false;
let completed = [false,false,false,false];

const $ = id => document.getElementById(id);

function shuffle(arr) {
  const a = [...arr];
  for(let i=a.length-1;i>0;i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function escapeHTML(str) {
  return String(str).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#39;"
  })[c]);
}

function buildGroups() {
  $("groups").innerHTML = groupInfo.map((g,i) => `
    <section class="group" id="group${i}"
      style="--color:${g.color}">
      <div class="group-head">
        <div class="robot-icon">${g.robot}</div>
        <h2>${g.name}</h2>
        <div class="score" id="score${i}">0 poin</div>
      </div>

      <div class="progress-area">
        <div class="progress-label">
          <span>Progres balapan</span>
          <span id="progressText${i}">0/50</span>
        </div>
        <div class="race-track">
          <div class="race-fill" id="fill${i}"></div>
          <div class="race-robot" id="raceRobot${i}">${g.robot}</div>
        </div>
      </div>

      <div class="question-area">
        <div class="question-number" id="number${i}">
          MENUNGGU PERMAINAN
        </div>
        <p class="question" id="question${i}">
          Tekan Mulai Balapan untuk memulai.
        </p>
        <div class="answers" id="answers${i}"></div>
        <div class="feedback" id="feedback${i}"></div>
        <div class="group-done" id="done${i}">
          🏁 SELESAI!
        </div>
      </div>
    </section>
  `).join("");
}

function updateProgress(i) {
  const pct = answered[i] / TOTAL_QUESTIONS * 100;
  $("score"+i).textContent = scores[i] + " poin";
  $("progressText"+i).textContent =
    answered[i] + "/" + TOTAL_QUESTIONS;
  $("fill"+i).style.width = pct + "%";
  $("raceRobot"+i).style.left = Math.min(95,pct*0.95) + "%";
}

function prepareDecks() {
  decks = [[],[],[],[]];

  // Setiap ronde mengambil empat soal berbeda jika tersedia.
  for(let round=0;round<TOTAL_QUESTIONS;round++) {
    const pool = shuffle(questions);
    const used = new Set();

    for(let g=0;g<4;g++) {
      let question = pool.find(q => !used.has(q));
      if(!question) {
        question = pool[g % pool.length];
      }
      used.add(question);

      const options = shuffle([
        {text:question.correct,isCorrect:true},
        ...question.wrong.map(text => ({text,isCorrect:false}))
      ]);

      decks[g].push({
        q:question.q,
        options:options
      });
    }
  }
}

function showQuestion(i) {
  if(!gameRunning || completed[i]) return;

  if(answered[i] >= TOTAL_QUESTIONS) {
    completeGroup(i);
    return;
  }

  const q = decks[i][answered[i]];
  $("number"+i).textContent =
    groupInfo[i].name + " • SOAL " + (answered[i]+1) + " DARI 50";
  $("question"+i).textContent = q.q;
  $("feedback"+i).textContent = "";
  $("answers"+i).innerHTML = "";

  q.options.forEach((option,index) => {
    const btn = document.createElement("button");
    btn.className = "answer";
    btn.textContent = String.fromCharCode(65+index) + ". " + option.text;
    btn.addEventListener("click", () => answerQuestion(i,index));
    $("answers"+i).appendChild(btn);
  });
}

function answerQuestion(i,selected) {
  if(!gameRunning || busy[i] || completed[i]) return;

  busy[i] = true;
  const q = decks[i][answered[i]];
  const buttons = [...$("answers"+i).querySelectorAll("button")];
  buttons.forEach(b => b.disabled = true);

  if(q.options[selected].isCorrect) {
    scores[i] += 10;
    buttons[selected].classList.add("correct");
    $("feedback"+i).textContent = "✅ Benar! Robot maju 10 poin.";
    $("feedback"+i).style.color = "#4ade80";
  } else {
    buttons[selected].classList.add("wrong");
    const correctIndex = q.options.findIndex(o => o.isCorrect);
    if(correctIndex >= 0) buttons[correctIndex].classList.add("correct");
    $("feedback"+i).textContent = "❌ Salah! Robot tidak maju.";
    $("feedback"+i).style.color = "#fb7185";
  }

  answered[i]++;
  updateProgress(i);

  setTimeout(() => {
    busy[i] = false;

    if(answered[i] >= TOTAL_QUESTIONS) {
      completeGroup(i);
    } else {
      showQuestion(i);
    }
  },900);
}

function completeGroup(i) {
  completed[i] = true;
  busy[i] = false;
  $("number"+i).textContent = "50 SOAL SELESAI";
  $("question"+i).textContent = "Hebat! Kamu telah menyelesaikan semua soal.";
  $("answers"+i).innerHTML = "";
  $("feedback"+i).textContent = "Total skor: " + scores[i] + " poin.";
  $("feedback"+i).style.color = groupInfo[i].color;
  $("done"+i).style.display = "block";

  if(completed.every(Boolean)) finishGame();
}

function startGame() {
  gameRunning = false;
  answered = [0,0,0,0];
  scores = [0,0,0,0];
  busy = [false,false,false,false];
  completed = [false,false,false,false];

  $("result").style.display = "none";
  $("startBtn").disabled = true;

  prepareDecks();

  for(let i=0;i<4;i++) {
    $("done"+i).style.display = "none";
    updateProgress(i);
    $("number"+i).textContent = "BERSIAP...";
    $("question"+i).textContent = "Balapan segera dimulai!";
    $("answers"+i).innerHTML = "";
    $("feedback"+i).textContent = "";
  }

  let count = 3;
  $("loadStatus").textContent = "Balapan dimulai dalam " + count + "...";

  const timer = setInterval(() => {
    count--;
    if(count > 0) {
      $("loadStatus").textContent = "Balapan dimulai dalam " + count + "...";
    } else {
      clearInterval(timer);
      gameRunning = true;
      $("loadStatus").textContent =
        "Balapan berlangsung! Setiap kelompok menjawab di kolom masing-masing.";

      for(let i=0;i<4;i++) showQuestion(i);
    }
  },1000);
}

function finishGame() {
  gameRunning = false;
  $("startBtn").disabled = false;

  const ranking = scores
    .map((score,i) => ({score,i}))
    .sort((a,b) => b.score-a.score);

  const highest = ranking[0].score;
  const winners = ranking.filter(r => r.score === highest);

  $("winnerText").textContent = winners.length > 1
    ? "Hasil seri! Selamat kepada semua kelompok dengan skor tertinggi."
    : groupInfo[winners[0].i].name + " menjadi juara dengan " + highest + " poin!";

  $("ranking").innerHTML = ranking.map((r,index) =>
    `<li>${index+1}. ${groupInfo[r.i].name} — ${r.score} poin</li>`
  ).join("");

  $("result").style.display = "block";
  $("result").scrollIntoView({behavior:"smooth",block:"nearest"});
  $("loadStatus").textContent = "Semua kelompok telah menyelesaikan 50 soal.";
}

async function loadSpreadsheet() {
  const sheetId = $("sheetId").value.trim();

  if(!sheetId) {
    $("loadStatus").textContent = "Masukkan ID Google Spreadsheet terlebih dahulu.";
    return;
  }

  $("loadBtn").disabled = true;
  $("loadStatus").textContent = "Sedang memuat soal...";

  try {
    const url =
      "https://docs.google.com/spreadsheets/d/" +
      encodeURIComponent(sheetId) +
      "/gviz/tq?tqx=out:json";

    const response = await fetch(url);
    if(!response.ok) throw new Error("Spreadsheet tidak dapat diakses.");

    const raw = await response.text();
    const start = raw.indexOf("{");
    const end = raw.lastIndexOf("}");

    if(start < 0 || end < 0) {
      throw new Error("Format data spreadsheet tidak dikenali.");
    }

    const data = JSON.parse(raw.slice(start,end+1));
    const rows = data.table?.rows || [];

    const parsed = rows.map(row => {
      const cells = (row.c || []).map(cell =>
        cell && cell.v != null ? String(cell.v).trim() : ""
      );

      return {
        q:cells[0] || "",
        correct:cells[1] || "",
        wrong1:cells[2] || "",
        wrong2:cells[3] || ""
      };
    }).filter(q => q.q && q.correct && q.wrong1 && q.wrong2)
      .map(q => ({
        q:q.q,
        correct:q.correct,
        wrong:[q.wrong1,q.wrong2]
      }));

    if(parsed.length < 4) {
      throw new Error("Minimal 4 soal valid harus tersedia. Periksa kolom A-D.");
    }

    questions = parsed;
    $("loadStatus").textContent =
      "✅ Berhasil memuat " + questions.length +
      " soal. Setiap kelompok akan mendapat 50 soal secara acak.";

  } catch(error) {
    $("loadStatus").textContent =
      "⚠️ Gagal memuat soal: " + error.message +
      " Pastikan akses spreadsheet diatur ke Siapa saja yang memiliki link (Pelihat).";
  } finally {
    $("loadBtn").disabled = false;
  }
}

$("loadBtn").addEventListener("click",loadSpreadsheet);

$("startBtn").addEventListener("click",() => {
  if(gameRunning) return;
  startGame();
});

$("fullBtn").addEventListener("click",async () => {
  try {
    if(!document.fullscreenElement) {
      await document.documentElement.requestFullscreen();
    } else {
      await document.exitFullscreen();
    }
  } catch(error) {
    $("loadStatus").textContent =
      "Browser ini tidak mendukung layar penuh.";
  }
});

buildGroups();
for(let i=0;i<4;i++) updateProgress(i);
</script>
</body>
</html>
